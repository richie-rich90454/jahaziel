gateway:
  listen_address: 127.0.0.1
  listen_port: 8081
  public_domain: code.example.com

jwt:
  issuer: https://code.example.com
  public_key_file: /etc/jahaziel/tls/jwt.pub
  max_ttl_seconds: 900

workspace_lookup:
  refresh_interval_seconds: 5
  cache_size: 10000
  cache_ttl_seconds: 60

proxy:
  connect_timeout_ms: 5000
  read_timeout_ms: 30000
  idle_timeout_ms: 300000
  max_request_body_bytes: 1073741824     # 1 GiB (for file uploads)
  max_response_body_bytes: 0             # unlimited (streaming)
  websocket_buffer_bytes: 32768
  websocket_write_timeout_ms: 10000

logging:
  level: INFO
  format: json
  file: /var/log/jahaziel/gateway.log
