node:
  id: node-a

firecracker:
  binary: /usr/local/bin/firecracker
  jailer_binary: /usr/local/bin/jailer
  jail_root: /var/lib/jahaziel/jail
  kernel_image: /var/lib/jahaziel/images/vmlinux-6.1.102

storage:
  root: /var/lib/jahaziel
  images_dir: /var/lib/jahaziel/images
  workspaces_dir: /var/lib/jahaziel/workspaces
  audit_staging_dir: /var/lib/jahaziel/audit

networking:
  bridge_name: br-jahaziel
  tap_prefix: tap-
  subnet: "10.100.0.0/16"

cgroups:
  root: /sys/fs/cgroup/jahaziel

# Only the keys above are read (see NodeAgentConfig); anything else is
# ignored. Server mTLS, metrics export, and structured logging land with
# their features instead of hiding here as dead knobs.
