name: Linux build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-26.04
            machine: x86_64
          - arch: arm64
            runner: ubuntu-26.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Cache Maven wrapper distribution
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/maven-wrapper
          key: ${{ runner.os }}-${{ runner.arch }}-maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - name: Cache Maven repository
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/maven/repository
          key: ${{ runner.os }}-${{ runner.arch }}-maven-repo-${{ hashFiles('pom.xml') }}
      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/pnpm-home/store
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('web/pnpm-lock.yaml') }}
      - name: Verify native runner architecture
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.machine }}"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Python template runtime
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y python3 python3-venv
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12.14.0
      - name: Audit dependency lockfiles
        shell: bash
        run: |
          pnpm --dir web audit --audit-level=high
          pnpm --dir docs audit --audit-level=high
      - name: Build docs site
        shell: bash
        run: |
          pnpm --dir docs install --frozen-lockfile
          pnpm --dir docs run docs:build
      - name: Build browser workbench
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run test:launch-config
          pnpm run build
      - name: Verify, package, and smoke launch the jar
        run: ./mvnw -B verify -Psmoke
      - name: Install the ephemeral CI browser
        shell: bash
        run: |
          browser_tools="$RUNNER_TEMP/jahaziel-browser-tools"
          mkdir -p "$browser_tools"
          printf '{"private":true,"packageManager":"pnpm@12.14.0"}\n' > "$browser_tools/package.json"
          pnpm --dir "$browser_tools" add --save-exact --store-dir "$RUNNER_TEMP/jahaziel-pnpm-store" playwright@1.65.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/jahaziel-playwright-browsers" \
            "$browser_tools/node_modules/.bin/playwright" install --with-deps --only-shell chromium
      - name: Exercise the workbench E2E suite
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/jahaziel-playwright-browsers
        run: pnpm --dir web exec playwright test
      - name: Exercise the packaged workbench in a browser
        shell: bash
        run: |
          export NODE_PATH="$RUNNER_TEMP/jahaziel-browser-tools/node_modules"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/jahaziel-playwright-browsers"
          node tools/browser-smoke.cjs target/jahaziel.jar
      - name: Report and bound release artifact sizes
        shell: bash
        run: |
          jar_bytes=$(stat -c '%s' target/jahaziel.jar)
          web_bytes=$(du -sb web/dist | cut -f1)
          printf 'Executable jar: %s bytes\n' "$jar_bytes"
          printf 'Workbench assets: %s bytes\n' "$web_bytes"
          test "$jar_bytes" -lt $((100 * 1024 * 1024))
          test "$web_bytes" -lt $((8 * 1024 * 1024))
          if jar tf target/jahaziel.jar | grep -Eiq 'BOOT-INF/classes/(ide/|dev/jahaziel/ide/|.*(clangd|jdtls|gopls|rust-analyzer|pyright))'; then
            echo 'Jar contains a bundled IDE server or language toolchain.' >&2
            exit 1
          fi
      - name: Publish the SHA256SUMS sidecar
        shell: bash
        run: |
          (cd target && sha256sum jahaziel.jar > SHA256SUMS)
          cat target/SHA256SUMS
      - name: Upload jar and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jahaziel-linux-${{ matrix.arch }}
          path: |
            target/jahaziel.jar
            target/SHA256SUMS
          if-no-files-found: error

