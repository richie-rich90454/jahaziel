name: Deployment acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm, macos-15, macos-15-intel, windows-2025]
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - name: Build browser workbench
        shell: bash
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Package the executable jar
        shell: bash
        run: ./mvnw -B package -DskipTests -Dmaven.test.skip=true
      - name: Run deployment acceptance against the packaged jar
        shell: bash
        timeout-minutes: 12
        run: node tools/deployment-acceptance.cjs target/jahaziel.jar
