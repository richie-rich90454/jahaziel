name: Deployment acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-26.04
            shell: bash
            mvnw: ./mvnw
          - arch: arm64
            runner: ubuntu-26.04-arm
            shell: bash
            mvnw: ./mvnw
          - arch: arm64
            runner: macos-15
            shell: bash
            mvnw: ./mvnw
          - arch: x64
            runner: macos-15-intel
            shell: bash
            mvnw: ./mvnw
          - arch: x64
            runner: windows-2025
            shell: pwsh
            mvnw: .\mvnw.cmd
    name: ${{ matrix.runner }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - name: Build browser workbench
        shell: ${{ matrix.shell }}
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Package the executable jar
        shell: ${{ matrix.shell }}
        run: ${{ matrix.mvnw }} -B package -DskipTests
      - name: Run deployment acceptance against the packaged jar
        shell: ${{ matrix.shell }}
        timeout-minutes: 12
        run: node tools/deployment-acceptance.cjs target/jahaziel.jar
