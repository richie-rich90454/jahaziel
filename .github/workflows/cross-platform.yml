name: Cross-platform build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - name: Build browser workbench
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run format:check
          pnpm run build
      - name: Verify Java sources and tests
        shell: bash
        run: ./mvnw -B test -Dfmt.skip=true -Dlicense.skip=true
      - name: List Windows E2E suite shape
        working-directory: web
        run: pnpm exec playwright test --list

  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - name: Build browser workbench
        working-directory: web
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm run format:check
          pnpm run build
      - name: Verify Java sources and tests
        shell: cmd
        run: mvnw.cmd -B test -Dfmt.skip=true -Dlicense.skip=true
      - name: List Windows E2E suite shape
        working-directory: web
        shell: pwsh
        run: pnpm exec playwright test --list
